name: Build Anymore Kernel with /proc/version patch

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kernel source
        run: |
          git clone https://github.com/AnymoreProject/android_kernel_vayu -b 16 kernel
          cd kernel

      - name: Apply /proc/version patch
        run: |
          cd kernel
          cat > fs/proc/version.patch << 'EOF'
          --- a/fs/proc/version.c
          +++ b/fs/proc/version.c
          @@ -10,7 +10,8 @@ static int version_proc_show(struct seq_file *m, void *v)
           {
          -    seq_printf(m, linux_proc_banner, utsname()->sysname, utsname()->release, utsname()->version);
          +    seq_printf(m, "Linux version %s (%s) (%s) %s\n",
          +               "4.14.180-perf-g2c687cdb9430",
          +               "#1 SMP PREEMPT Sat Apr 25 12:07:19 WIB 2026",
          +               utsname()->sysname, "Android clang version 22.0.2");
               return 0;
           }
          EOF
          patch -p1 < fs/proc/version.patch

      - name: Setup build dependencies
        run: |
          sudo apt update
          sudo apt install -y git make bc bison flex libssl-dev libelf-dev \
            gcc-aarch64-linux-gnu clang lld

      - name: Build kernel
        run: |
          cd kernel
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CC=clang
          export LD=ld.lld
          export CLANG_TRIPLE=aarch64-linux-gnu-
          make vayu_defconfig
          make -j$(nproc)

      - name: Upload kernel image
        uses: actions/upload-artifact@v4
        with:
          name: kernel-image
          path: kernel/arch/arm64/boot/Image.gz-dtb
